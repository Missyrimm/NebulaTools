name: Build & Release

on:
  push:
    tags:
      - 'v*' # Запускается при пуше тега, например v2.7.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="assets/icons/logo.ico" --add-data "qml;qml" --add-data "assets;assets" --name="NebulaTools" main.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaTools-Windows
          path: dist/NebulaTools/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="assets/icons/logo.icns" --add-data "qml:qml" --add-data "assets:assets" --name="NebulaTools" main.py
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaTools-macOS
          path: dist/NebulaTools.app/

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NebulaTools-*   # Скачиваем все артефакты, начинающиеся с NebulaTools-
          merge-multiple: true    # Объединяем их в одну папку
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/**/* # Загружаем все файлы из папки release-assets в релиз
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
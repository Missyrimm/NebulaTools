name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "NebulaTools" --add-data "qml;qml" --add-data "assets;assets" --add-data "flp_native;flp_native" --add-data "nebula_modules;nebula_modules" --add-data "flp_core.py;." --add-data "flp_native.py;." --add-data "updater.py;." --collect-all PySide6 --collect-all soundfile main.py
      - name: Copy update scripts
        run: |
          copy build\update.bat dist\NebulaTools\
          copy updater.py dist\NebulaTools\
      - name: Pack 7z
        run: |
          winget install --id 7zip.7zip -e --silent --accept-source-agreements --accept-package-agreements
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 "NebulaTools-Windows.7z" ".\dist\NebulaTools\*"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: NebulaTools-Windows.7z

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install p7zip
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "NebulaTools" --add-data "qml:qml" --add-data "assets:assets" --add-data "flp_native:flp_native" --add-data "nebula_modules:nebula_modules" --add-data "flp_core.py:." --add-data "flp_native.py:." --add-data "updater.py:." --collect-all PySide6 --collect-all soundfile main.py
      - name: Copy update scripts
        run: |
          cp build/update.sh dist/NebulaTools/
          cp updater.py dist/NebulaTools/
          chmod +x dist/NebulaTools/update.sh
      - name: Pack 7z
        run: |
          cd dist && 7z a -t7z -mx=9 ../NebulaTools-macOS.7z NebulaTools/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: NebulaTools-macOS.7z

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 ffmpeg p7zip-full
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "NebulaTools" --add-data "qml:qml" --add-data "assets:assets" --add-data "flp_native:flp_native" --add-data "nebula_modules:nebula_modules" --add-data "flp_core.py:." --add-data "flp_native.py:." --add-data "updater.py:." --collect-all PySide6 --collect-all soundfile main.py
      - name: Copy update scripts
        run: |
          cp build/update.sh dist/NebulaTools/
          cp updater.py dist/NebulaTools/
          chmod +x dist/NebulaTools/update.sh
      - name: Pack 7z
        run: |
          cd dist && 7z a -t7z -mx=9 ../NebulaTools-Linux.7z NebulaTools/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: NebulaTools-Linux.7z

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NebulaTools-Windows.7z
            artifacts/NebulaTools-macOS.7z
            artifacts/NebulaTools-Linux.7z
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "NebulaTools" --icon "icon\logo.ico" --add-data "qml;qml" --add-data "assets;assets" --add-data "flp_native;flp_native" --add-data "nebula_modules;nebula_modules" --add-data "flp_core.py;." --add-data "flp_native.py;." --add-data "updater.py;." --collect-all PySide6 --collect-all librosa main.py
      - name: Copy updater scripts
        run: |
          copy build\update.bat dist\NebulaTools\
          copy updater.py dist\NebulaTools\
      - name: Zip
        run: |
          Compress-Archive -Path "dist\NebulaTools\*" -DestinationPath "NebulaTools-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: NebulaTools-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "NebulaTools" --add-data "qml:qml" --add-data "assets:assets" --add-data "flp_native:flp_native" --add-data "nebula_modules:nebula_modules" --add-data "flp_core.py:." --add-data "flp_native.py:." --add-data "updater.py:." --collect-all PySide6 --collect-all librosa main.py
      - name: Copy updater scripts
        run: |
          cp build/update.sh dist/NebulaTools/
          cp updater.py dist/NebulaTools/
          chmod +x dist/NebulaTools/update.sh
      - name: Zip
        run: |
          cd dist && zip -r ../NebulaTools-macOS.zip NebulaTools/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: NebulaTools-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 ffmpeg
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "NebulaTools" --add-data "qml:qml" --add-data "assets:assets" --add-data "flp_native:flp_native" --add-data "nebula_modules:nebula_modules" --add-data "flp_core.py:." --add-data "flp_native.py:." --add-data "updater.py:." --collect-all PySide6 --collect-all librosa main.py
      - name: Copy updater scripts
        run: |
          cp build/update.sh dist/NebulaTools/
          cp updater.py dist/NebulaTools/
          chmod +x dist/NebulaTools/update.sh
      - name: Tar
        run: |
          cd dist && tar -czf ../NebulaTools-Linux.tar.gz NebulaTools/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: NebulaTools-Linux.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NebulaTools-Windows.zip
            artifacts/NebulaTools-macOS.zip
            artifacts/NebulaTools-Linux.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false